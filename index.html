<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smultronstället</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
  button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .primary { background: #0ea5e9; color: #fff; }
  .secondary { background: #e2e8f0; color: #0f172a; }
  .danger { background: #fee2e2; color: #dc2626; }
  .copy { background: #f1f5f9; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 0.9rem; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; background: #fef08a; }
  .muted { color: #64748b; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Smultronstället</h1>

  <div class="card row">
    <input id="search" placeholder="Sök namn eller nummer" oninput="render()" style="flex:1">
    <select id="sort" onchange="render()">
      <option value="az">A–Ö</option>
      <option value="za">Ö–A</option>
      <option value="newest">Nyast först</option>
    </select>
  </div>

  <div class="card row">
    <input id="name" placeholder="Namn / Företag">
    <input id="phone" placeholder="Telefonnummer">
    <input id="cat" placeholder="Kategori">
    <button class="primary" onclick="add()">Lägg till</button>
  </div>

  <div class="card row">
    <button class="secondary" onclick="exportJson()">Exportera till JSON</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">Importera från JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" onchange="importJson(event)" style="display:none">
    <span id="status" class="muted"></span>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Namn</th><th>Telefon</th><th>Kategori</th><th></th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="card">
    <div style="font-weight:600; margin-bottom:6px;">Kladdpapper</div>
    <textarea id="notes" oninput="localStorage.setItem('smultron_notes', this.value)"></textarea>
  </div>
</div>

<script>
  let contacts = JSON.parse(localStorage.getItem('smultron_contacts') || '[]');
  const $ = id => document.getElementById(id);

  function save() {
    localStorage.setItem('smultron_contacts', JSON.stringify(contacts));
  }

  function setStatus(msg) {
    $('status').textContent = msg;
    setTimeout(() => { $('status').textContent = ''; }, 4000);
  }

  function add() {
    const name = $('name').value.trim();
    const phone = $('phone').value.trim();
    const cat = $('cat').value.trim();
    if (!name || !phone) { alert('Fyll i namn och telefonnummer.'); return; }
    contacts.push({ id: Date.now() + Math.random(), name, phone, cat, created: Date.now() });
    save();
    $('name').value = ''; $('phone').value = ''; $('cat').value = '';
    render();
  }

  function remove(id) {
    if (!confirm('Ta bort kontakten?')) return;
    contacts = contacts.filter(c => c.id !== id);
    save();
    render();
  }

  function exportJson() {
    if (contacts.length === 0) { alert('Det finns inga kontakter att exportera.'); return; }
    const data = {
      app: 'smultronstallet',
      version: 1,
      exported: new Date().toISOString(),
      contacts: contacts.map(({ name, phone, cat, created }) => ({ name, phone, cat, created }))
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `smultronstallet-${date}.json`;
